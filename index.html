<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>记一笔 · 个人收支管理</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1f3a;--mu:#8087a2;--bd:#eceef6;--pri:#6366f1;--pri2:#8b5cf6;--inc:#10b981;--exp:#f43f5e;--sh:0 6px 24px #1b1f3a10;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--card:#171b31;--tx:#eef0fb;--mu:#8e94b4;--bd:#262b49;--pri:#818cf8;--pri2:#a78bfa;--inc:#34d399;--exp:#fb7185;--sh:0 6px 24px #0006}}
:root[data-theme=dark]{--bg:#0d1020;--card:#171b31;--tx:#eef0fb;--mu:#8e94b4;--bd:#262b49;--pri:#818cf8;--pri2:#a78bfa;--inc:#34d399;--exp:#fb7185;--sh:0 6px 24px #0006}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:104px;min-height:100%}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:260px;background:radial-gradient(600px 220px at 15% -20%,#6366f133,transparent),radial-gradient(500px 200px at 90% -10%,#8b5cf633,transparent);pointer-events:none}
.w{max-width:760px;margin:0 auto;padding:16px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0 0 12px;font-size:16px;font-weight:700}
#v>*{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 12px 30px #6366f155;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff1f}
.hero .k{color:#ffffffcc}.hero .n{color:#fff}.big{font-size:34px!important;letter-spacing:-.5px;margin:2px 0 14px}
.hs{background:#ffffff26;border-radius:14px;padding:12px;position:relative;z-index:1}
.g{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}.g2{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.g .card{padding:14px;font-size:13px;margin-bottom:0}.g{margin-bottom:14px}
.k{color:var(--mu);font-size:12px}.n{font-size:19px;font-weight:700;word-break:break-all}.inc{color:var(--inc)}.exp{color:var(--exp)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px #6366f122}
button{border:0;border-radius:12px;padding:10px 16px;background:var(--bd);cursor:pointer;transition:.15s}button:active{transform:scale(.96)}
.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:600;box-shadow:0 4px 12px #6366f144}
.d{background:transparent;color:var(--exp)}.s{padding:5px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.row .m{flex:1;min-width:0}.row .m b{display:block}.row .m span{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 10px 30px #1b1f3a26;display:flex;padding:6px;z-index:5}
.nav button{flex:1;background:none;font-size:11px;color:var(--mu);padding:7px 2px;border-radius:18px}.nav button.on{color:var(--pri);font-weight:700;background:#6366f11a}.nav i{display:block;font-style:normal;font-size:19px}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:30px;padding:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 24px #6366f177;z-index:6;line-height:1}
.bars{display:flex;gap:5px;height:130px;align-items:flex-end}.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.pair{display:flex;gap:3px;align-items:flex-end;height:100px;width:100%;justify-content:center}.b{width:42%;border-radius:6px 6px 2px 2px;min-height:3px;transition:height .5s}
.col small{font-size:10px;color:var(--mu);margin-top:4px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:5px}.bar>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px;transition:width .5s}
.donut{width:150px;height:150px;border-radius:50%;margin:4px auto 18px;display:grid;place-items:center}
.donut>div{width:98px;height:98px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px}.donut small{color:var(--mu);font-size:11px}
.mask{position:fixed;inset:0;background:#0b0e2299;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@media(min-width:600px){.mask{align-items:center}.modal{border-radius:26px}}
label{display:block;margin:12px 0 5px;color:var(--mu);font-size:13px}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px}.seg button{flex:1;background:none}.seg .on.e{background:var(--exp);color:#fff}.seg .on.i{background:var(--inc);color:#fff}.seg .p{box-shadow:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:14px;background:var(--inc);color:#fff;z-index:50;max-width:90%;box-shadow:0 8px 24px #0003;animation:up .25s}.toast.bad{background:var(--exp)}
.empty{text-align:center;color:var(--mu);padding:28px 10px}.f{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tag{display:inline-block;padding:5px 12px;border-radius:20px;background:var(--bg);margin:3px;font-size:13px}.tag button{padding:0 0 0 8px;background:none;color:var(--exp)}
.warn{background:#f43f5e1a;color:var(--exp);padding:9px 12px;border-radius:12px;margin-top:8px;font-size:13px}
</style></head><body>
<div class="w"><header><h1>💰 记一笔</h1><input type="month" id="mo" style="width:auto" onchange="setM(this.value)"></header><main id="v"></main></div>
<button class="fab" onclick="openForm()" aria-label="记一笔">＋</button>
<nav class="nav" id="nav"></nav><div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={tx:[],cats:{expense:['餐饮','交通','购物','住房','娱乐','医疗','其他'],income:['工资','奖金','理财','其他']},bud:{}};
try{const r=localStorage.getItem('fin_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('fin_v1',JSON.stringify(S));return true}catch(e){toast('浏览器禁止本地存储，数据仅在本次页面有效',1);return false}}
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
let m=today().slice(0,7),view='home',F={mo:'',date:'',type:'',cat:'',q:''};
const addM=(ym,k)=>{const[y,o]=ym.split('-').map(Number);const d=new Date(y,o-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const fmt=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(fn,type)=>Math.round(S.tx.filter(t=>t.type===type&&fn(t)).reduce((a,t)=>a+t.amount,0)*100)/100;
const inM=ym=>t=>t.date.startsWith(ym);
function toast(s,bad){const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function setM(v){if(!v)return;m=v;render()}
function go(v){view=v;render()}
const PAL=['#6366f1','#f43f5e','#f59e0b','#10b981','#06b6d4','#a855f7','#ec4899','#84cc16'];const IC={餐饮:'🍜',交通:'🚌',购物:'🛍️',住房:'🏠',娱乐:'🎮',医疗:'💊',工资:'💼',奖金:'🎁',理财:'📈',其他:'✨'};const ico=(c,ty)=>IC[c]||(ty==='income'?'💰':'🏷️');
function row(t,act){return `<div class="row"><div class="ic" style="background:${t.type==='income'?'#10b98122':'#f43f5e22'}">${ico(t.cat,t.type)}</div><div class="m"><b>${esc(t.cat)}</b><span>${t.date}${t.note?' · '+esc(t.note):''}</span></div><b class="${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</b>${act?`<button class="s" onclick="openForm('${t.id}')">编辑</button><button class="s d" onclick="delTx('${t.id}')">删除</button>`:''}</div>`}
function catBars(ym,type){const map={};S.tx.filter(t=>t.type===type&&t.date.startsWith(ym)).forEach(t=>map[t.cat]=(map[t.cat]||0)+t.amount);
const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);const tot=arr.reduce((a,x)=>a+x[1],0);
if(!arr.length)return '<div class="empty">本月暂无数据</div>';
let acc=0;const grad=arr.map(([c,v],i)=>{const s=acc/tot*100;acc+=v;return PAL[i%8]+' '+s+'% '+(acc/tot*100)+'%'}).join(',');
return `<div class="donut" style="background:conic-gradient(${grad})"><div><small>合计</small><b>${fmt(tot)}</b></div></div>`+arr.map(([c,v],i)=>{const p=v/tot*100;return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><span>${ico(c,type)} ${esc(c)}</span><span>${fmt(v)} · ${p.toFixed(1)}%</span></div><div class="bar"><div style="width:${p}%;background:${PAL[i%8]}"></div></div></div>`}).join('')}
function trend(list){const data=list.map(ym=>[ym,sum(inM(ym),'income'),sum(inM(ym),'expense')]);const mx=Math.max(1,...data.flatMap(d=>[d[1],d[2]]));
return `<div class="bars">${data.map(d=>`<div class="col"><div class="pair"><div class="b" style="height:${d[1]/mx*100}%;background:var(--inc)" title="收入 ${d[1]}"></div><div class="b" style="height:${d[2]/mx*100}%;background:var(--exp)" title="支出 ${d[2]}"></div></div><small>${+d[0].slice(5)}月</small></div>`).join('')}</div><div class="k" style="margin-top:6px"><span class="inc">■</span> 收入 <span class="exp">■</span> 支出（柱高与真实记录成比例）</div>`}
function budCard(){const b=S.bud[m],e=sum(inM(m),'expense');if(!b)return `<div class="card"><h3>预算</h3><div class="k">${m} 尚未设置预算</div><button class="p" style="margin-top:8px" onclick="go('bud')">去设置</button></div>`;
const p=e/b*100;return `<div class="card"><h3>预算使用 ${p.toFixed(1)}%</h3><div class="bar"><div style="width:${Math.min(100,p)}%;background:${p>100?'var(--exp)':'var(--pri)'}"></div></div><div class="k" style="margin-top:6px">已支出 ${fmt(e)} / 预算 ${fmt(b)} · ${b-e>=0?'剩余 '+fmt(b-e):'超支 '+fmt(e-b)}</div>${p>100?'<div class="warn">⚠️ 本月支出已超出预算</div>':''}</div>`}
function vHome(){const inc=sum(inM(m),'income'),exp=sum(inM(m),'expense'),bal=Math.round((inc-exp)*100)/100,td=today();
const rec=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
return `<div class="hero"><div class="k">${m} 本月结余</div><div class="n big">${fmt(bal)}</div><div class="g2 hs"><div><div class="k">↓ 本月收入</div><div class="n">${fmt(inc)}</div></div><div><div class="k">↑ 本月支出</div><div class="n">${fmt(exp)}</div></div></div></div>
<div class="card"><div class="k">今日（${td}）</div><div class="g2"><div>收入 <b class="inc">${fmt(sum(t=>t.date===td,'income'))}</b></div><div>支出 <b class="exp">${fmt(sum(t=>t.date===td,'expense'))}</b></div></div></div>
${budCard()}<div class="card"><h3>近 6 个月趋势</h3>${trend([-5,-4,-3,-2,-1,0].map(k=>addM(m,k)))}</div>
<div class="card"><h3>${m} 支出分类</h3>${catBars(m,'expense')}</div>
<div class="card"><h3 style="display:flex;justify-content:space-between">最近记录<button class="s" onclick="go('rec')">全部</button></h3>${rec.length?rec.map(t=>row(t)).join(''):'<div class="empty">还没有记录 🌱<br>点右下角 ＋ 记下第一笔吧<br><br><button class="p" onclick="openForm()">记一笔</button></div>'}</div>`}
function filtered(){return S.tx.filter(t=>(!F.mo||t.date.startsWith(F.mo))&&(!F.date||t.date===F.date)&&(!F.type||t.type===F.type)&&(!F.cat||t.cat===F.cat)&&(!F.q||(t.note+t.cat).toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function vRec(){const all=[...new Set([...S.cats.expense,...S.cats.income])];const l=filtered();
return `<div class="card"><div class="f"><div><label>月份</label><input type="month" value="${F.mo}" onchange="F.mo=this.value;render()"></div><div><label>日期</label><input type="date" value="${F.date}" onchange="F.date=this.value;render()"></div>
<div><label>类型</label><select onchange="F.type=this.value;render()"><option value="">全部</option><option value="income" ${F.type==='income'?'selected':''}>收入</option><option value="expense" ${F.type==='expense'?'selected':''}>支出</option></select></div>
<div><label>分类</label><select onchange="F.cat=this.value;render()"><option value="">全部</option>${all.map(c=>`<option ${F.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
<input id="q" placeholder="🔍 搜索备注或分类" value="${esc(F.q)}" oninput="F.q=this.value;list()"><div style="margin-top:8px"><button class="s" onclick="F={mo:'',date:'',type:'',cat:'',q:''};render()">清除筛选</button></div></div>
<div class="card" id="lst"></div>`}
function list(){const l=filtered(),i=l.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),e=l.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
$('#lst').innerHTML=l.length?`<div class="k">共 ${l.length} 笔 · 收入 ${fmt(i)} · 支出 ${fmt(e)}</div>`+l.map(t=>row(t,1)).join(''):`<div class="empty">${S.tx.length?'没有符合条件的记录':'还没有记录，点 ＋ 开始记账'}</div>`}
function vStat(){const y=m.slice(0,4),td=today();const mk=(l,fn)=>`<div class="card"><div class="k">${l}</div><div>收入 <b class="inc">${fmt(sum(fn,'income'))}</b></div><div>支出 <b class="exp">${fmt(sum(fn,'expense'))}</b></div></div>`;
return `<div class="g">${mk('今日',t=>t.date===td)}${mk(m+' 月',inM(m))}${mk(y+' 年',inM(y))}</div>
<div class="card"><h3>${y} 年逐月趋势</h3>${trend(Array.from({length:12},(_,i)=>y+'-'+pad(i+1)))}</div>
<div class="card"><h3>${m} 支出占比与排行</h3>${catBars(m,'expense')}</div><div class="card"><h3>${m} 收入构成</h3>${catBars(m,'income')}</div>`}
function vBud(){const b=S.bud[m],e=sum(inM(m),'expense');
return `<div class="card"><h3>${m} 月预算</h3><label>每月总预算（元）</label><input id="bi" inputmode="decimal" value="${b||''}" placeholder="例如 3000"><div style="margin-top:10px;display:flex;gap:8px"><button class="p" onclick="setBud()">保存预算</button>${b?'<button onclick="clrBud()">清除</button>':''}</div></div>${b?budCard():'<div class="card empty">设置预算后可查看使用率和剩余额度<br>（可用顶部月份切换查看其他月份）</div>'}
<div class="card"><div class="k">预算与支出按月独立保存</div><div>${m} 已支出：<b>${fmt(e)}</b></div></div>`}
function setBud(){const v=parseAmt($('#bi').value);if(v===null)return;S.bud[m]=v;save()&&toast('预算已保存');render()}
function clrBud(){delete S.bud[m];save();toast('已清除');render()}
function parseAmt(s){s=String(s).trim();if(!s){toast('请输入金额',1);return null}if(!/^\d+(\.\d{1,2})?$/.test(s)){toast('金额须为正数，最多两位小数（不能为负数或含字母）',1);return null}const v=+s;if(v<=0){toast('金额必须大于 0',1);return null}if(v>1e9){toast('金额过大',1);return null}return v}
function vSet(){return `<div class="card"><h3>分类管理</h3>${['expense','income'].map(ty=>`<div class="k" style="margin-top:8px">${ty==='expense'?'支出分类':'收入分类'}</div>${S.cats[ty].map(c=>`<span class="tag">${esc(c)}<button onclick="delCat('${ty}',${S.cats[ty].indexOf(c)})">✕</button></span>`).join('')}<div style="display:flex;gap:8px;margin-top:6px"><input id="nc_${ty}" placeholder="新分类名称" maxlength="10"><button class="p" style="white-space:nowrap" onclick="addCat('${ty}')">添加</button></div>`).join('')}</div>
<div class="card"><h3>数据管理</h3><div class="k">数据仅保存在当前浏览器的本地存储中，不会同步到云端；清理浏览器数据、换设备或使用无痕模式可能导致记录丢失，请定期导出备份。</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="p" onclick="exportData()">导出数据</button><button class="d" onclick="ask('清空所有记录、预算和自定义分类？此操作不可恢复。',()=>{S={tx:[],cats:{expense:['餐饮','交通','购物','住房','娱乐','医疗','其他'],income:['工资','奖金','理财','其他']},bud:{}};save();toast('已清空');render()})">清空全部数据</button></div><div class="k" style="margin-top:8px">共 ${S.tx.length} 笔记录</div></div>`}
function addCat(ty){const v=$('#nc_'+ty).value.trim();if(!v)return toast('请输入分类名称',1);if(S.cats[ty].includes(v))return toast('分类已存在',1);S.cats[ty].push(v);save();toast('已添加');render()}
function delCat(ty,i){const c=S.cats[ty][i];if(S.tx.some(t=>t.type===ty&&t.cat===c))return toast('该分类下已有记录，不能删除',1);if(S.cats[ty].length<=1)return toast('至少保留一个分类',1);S.cats[ty].splice(i,1);save();render()}
let ft='expense',eid=null;
function openForm(id){eid=id||null;const t=id?S.tx.find(x=>x.id===id):null;ft=t?t.type:'expense';formUI(t)}
function formUI(t){t=t||{amount:'',date:today(),cat:'',note:''};const cur=$('#f_a')?{amount:$('#f_a').value,date:$('#f_d').value,note:$('#f_n').value}:null;if(cur)t=Object.assign(t,cur);
$('#ov').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal"><h3>${eid?'编辑记录':'记一笔'}</h3><div class="seg"><button class="e ${ft==='expense'?'on':''}" onclick="ft='expense';formUI()">支出</button><button class="i ${ft==='income'?'on':''}" onclick="ft='income';formUI()">收入</button></div>
<label>金额（元）</label><input id="f_a" inputmode="decimal" placeholder="0.00" value="${t.amount}"><label>日期</label><input id="f_d" type="date" value="${t.date}"><label>分类</label><select id="f_c">${S.cats[ft].map(c=>`<option ${t.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input id="f_nc" placeholder="或输入新分类名称（可选）" style="margin-top:6px" maxlength="10"><label>备注</label><input id="f_n" maxlength="60" value="${esc(t.note)}" placeholder="可选">
<div style="display:flex;gap:8px;margin-top:16px"><button style="flex:1" onclick="closeM()">取消</button><button class="p" style="flex:2" onclick="saveTx()">保存</button></div></div></div>`}
function closeM(){$('#ov').innerHTML=''}
function saveTx(){const a=parseAmt($('#f_a').value);if(a===null)return;const d=$('#f_d').value;if(!d)return toast('请选择日期',1);let c=$('#f_nc').value.trim()||$('#f_c').value;if(!c)return toast('请选择分类',1);if(!S.cats[ft].includes(c))S.cats[ft].push(c);
const o={type:ft,amount:a,date:d,cat:c,note:$('#f_n').value.trim()};if(eid){Object.assign(S.tx.find(x=>x.id===eid),o)}else S.tx.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)},o));
save()&&toast(eid?'已更新':'已保存');closeM();render()}
function ask(msg,fn){window._fn=fn;$('#ov').innerHTML=`<div class="mask"><div class="modal"><h3>请确认</h3><p>${esc(msg)}</p><div style="display:flex;gap:8px"><button style="flex:1" onclick="closeM()">取消</button><button class="p" style="flex:1;background:var(--exp)" onclick="closeM();window._fn()">确认</button></div></div></div>`}
function delTx(id){ask('确定删除这笔记录吗？',()=>{S.tx=S.tx.filter(t=>t.id!==id);save();toast('已删除');render()})}
function exportData(){const csv='日期,类型,分类,金额,备注\n'+[...S.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='income'?'收入':'支出',t.cat,t.amount,'"'+t.note.replace(/"/g,'""')+'"'].join(',')).join('\n');
const js=JSON.stringify(S,null,1);window._ex={csv,js};
$('#ov').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal"><h3>导出数据</h3><div class="k">已发布页面无法直接下载文件，请复制下面的内容并粘贴保存为 .csv / .json 文件。</div><div class="seg" style="margin:10px 0"><button class="p" onclick="showEx('csv')">CSV（表格）</button><button onclick="showEx('js')">JSON（完整备份）</button></div><textarea id="ex" rows="9" readonly></textarea><div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" onclick="closeM()">关闭</button><button class="p" style="flex:1" onclick="cp()">复制全部</button></div></div></div>`;$('#ex').value=csv}
function showEx(k){$('#ex').value=window._ex[k]}
function cp(){const e=$('#ex');e.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(e.value).then(()=>toast('已复制'),()=>toast('请长按文本手动复制',1));else toast(ok?'已复制':'请长按文本手动复制',!ok)}
function render(){$('#mo').value=m;const V={home:vHome,rec:vRec,stat:vStat,bud:vBud,set:vSet};$('#v').innerHTML=V[view]();if(view==='rec')list();
$('#nav').innerHTML=[['home','🏠','首页'],['rec','📋','记录'],['stat','📊','统计'],['bud','🎯','预算'],['set','⚙️','设置']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}
render();
</script></body></html>
